
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tripnesia - Lupa Kata Sandi</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <style>
        :root {
            --bs-primary: #0a84c6;
            --bs-primary-rgb: 10, 132, 198;
            --tn-border: #dfe5ee;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: #111827;
            background: #fff;
        }

        /* Ukuran halaman sama dengan daftar.html */
        .page {
            width: 100%;
            max-width: 960px;
            margin: 0 auto;
        }

        .forgot-section {
            min-height: calc(100vh - 65px);
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 40px 20px 24px;
        }

        /* Ukuran kartu sama dengan register-card */
        .forgot-card {
            position: relative;
            width: 100%;
            max-width: 390px;
            min-height: 620px;
            padding: 0 26px 50px;
            background: #fff;
        }

        /* Status bar */
        .status-bar {
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 0 -6px;
            font-size: 8px;
        }

        .status-icons {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 10px;
        }

        /* Form lupa kata sandi */
        .forgot-content {
            padding-top: 69px;
        }

        .forgot-heading {
            margin: 0 0 12px;
            color: #080808;
            text-align: center;
            font-size: 21px;
            line-height: 28px;
            font-weight: 700;
        }

        .forgot-description {
            margin: 0 0 35px;
            color: #9299a5;
            text-align: center;
            font-size: 10px;
            line-height: 16px;
        }

        /* Input email */
        .form-label {
            display: block;
            margin-bottom: 7px;
            color: #222;
            font-size: 10px;
        }

        .form-control {
            width: 100%;
            height: 40px;
            padding: 10px 12px;
            border: 1px solid #c8ced5;
            border-radius: 8px;
            background: #f9fafb;
            font-size: 10px;
        }

        .form-control::placeholder {
            color: #9ca3af;
        }

        .form-control:focus {
            border-color: var(--bs-primary);
            box-shadow: 0 0 0 3px rgba(10, 132, 198, .12);
        }

        /* Tombol kirim */
        .btn-send {
            width: 100%;
            height: 40px;
            margin-top: 21px;
            border: 1px solid var(--bs-primary);
            border-radius: 8px;
            background: var(--bs-primary);
            color: #fff;
            font-size: 10px;
            font-weight: 500;
        }

        .btn-send:hover {
            border-color: #0873ab;
            background: #0873ab;
            color: #fff;
        }

        /* Pesan konfirmasi */
        .result-message {
            display: none;
            margin-top: 15px;
            font-size: 11px;
        }

        /* Footer sama dengan halaman daftar */
        .footer {
            position: absolute;
            right: 0;
            bottom: 0;
            left: 0;
            min-height: 31px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 8px 12px;
            border-top: 1px solid var(--tn-border);
            background: #f8fafc;
            color: #6b7280;
            font-size: 9px;
        }

        /* Responsif mengikuti daftar.html */
        @media (max-width: 575.98px) {
            .forgot-section {
                min-height: calc(100vh - 55px);
                padding: 24px 16px;
            }

            .forgot-card {
                max-width: 420px;
                min-height: 620px;
                padding-right: 10px;
                padding-left: 10px;
            }

            .forgot-content {
                padding-top: 69px;
            }

            .footer {
                font-size: 11px;
            }
        }

        @media (max-width: 360px) {
            .forgot-content {
                padding-right: 10px;
                padding-left: 10px;
            }

            .forgot-heading {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <section class="forgot-section">

            <div class="forgot-card">

                <!-- Konten lupa kata sandi -->
                <div class="forgot-content">

                    <h1 class="forgot-heading">
                        Lupa Kata Sandi ?
                    </h1>

                    <p class="forgot-description">
                        Masukkan Email anda untuk reset password
                    </p>

                    <form id="forgotForm">

                        <div>
                            <label for="email" class="form-label">
                                Alamat Email
                            </label>

                            <input type="email"
                                   class="form-control"
                                   id="email"
                                   name="email"
                                   placeholder="Masukkan Email"
                                   autocomplete="email"
                                   required>
                        </div>

                        <button type="submit"
                                class="btn btn-send"
                                id="sendButton">
                            Kirim
                        </button>

                        <div class="result-message alert alert-info"
                             id="resultMessage"
                             role="status"></div>

                    </form>

                </div>

                <!-- Footer -->
                <footer class="footer">
                    <i class="bi bi-c-circle"></i>
                    <span>Copyright TripNesia 2026</span>
                </footer>

            </div>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const forgotForm = document.getElementById("forgotForm");
        const emailInput = document.getElementById("email");
        const resultMessage = document.getElementById("resultMessage");

        forgotForm.addEventListener("submit", function (event) {
            event.preventDefault();

            if (!emailInput.checkValidity()) {
                emailInput.reportValidity();
                return;
            }

            alert("Berhasil! Kamu akan diarahkan kembali ke halaman login.");

            window.location.href = "login.html";
        });
    </script>

</body>
</html>
