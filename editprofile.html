<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profil - TripNesia</title>
</head>

<body>

    <header>
        <div>
            <a href="Beranda.html">
      <img src="../assets/images/logo.svg" alt="Tripnesia, Jelajahi Indonesia, Temukan Ceritamu" width="160">
        </a>
        </div>

    </header>

    <main>

        <section aria-labelledby="profil-pengguna">

            <h1 id="profil-pengguna">Profil Pengguna</h1>

            <figure>
                <img src="assets/images/Icon profile.png" alt="Foto profil pengguna">
                
                <button type="button" aria-label="Ubah foto profil">
                    📷
                </button>
            </figure>

            <p>
                <strong>MELPANSYANATPAL</strong>
            </p>

        </section>


        <section aria-labelledby="informasi-akun">

            <h2 id="informasi-akun">Informasi Akun</h2>

            <form action="#" method="post">

                <article>
                    <label for="username">
                        <span aria-hidden="true">👤</span>
                        Nama Pengguna
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        value="MELPANSYANATPAL"
                    >

                    <button type="button" aria-label="Edit nama pengguna">
                        ✎
                    </button>
                </article>


                <article>
                    <label for="email">
                        <span aria-hidden="true">✉</span>
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Email"
                    >

                    <button type="button" aria-label="Edit email">
                        ✎
                    </button>
                </article>


                <article>
                    <label for="phone">
                        <span aria-hidden="true">☎</span>
                        No Handphone
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="No Handphone"
                    >

                    <button type="button" aria-label="Edit nomor handphone">
                        ✎
                    </button>
                </article>


                <article>
                    <label for="password">
                        <span aria-hidden="true">🔑</span>
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Password"
                    >

                    <button type="button" aria-label="Edit password">
                        ✎
                    </button>
                </article>

            </form>

        </section>

    </main>


    <footer>
        <p>
            &copy; Copyright TripNesia 2026
        </p>
    </footer>

</body>
</html>
