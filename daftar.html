<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tripnesia - Daftar</title>
</head>
<body>

    <main>
        <section>
            <header>
                <h1>Tripnesia</h1>
                <p>Jelajah Indonesia, Temukan Cerita</p>
            </header>

            <nav>
            <form>
            <button type="submit" formaction="login.html">Masuk</button>
            <button type="submit" formaction="daftar.html">Daftar</button>
            </form>
            </nav>

            <form action="login.html" method="get">
                <div>
                    <label for="nama">Nama</label>
                    <br>
                    <input
                        type="text"
                        id="nama"
                        name="nama"
                        placeholder="Masukkan Nama"
                        required
                    >
                </div>

                <br>

                <div>
                    <label for="email">Email atau No HP</label>
                    <br>
                    <input
                        type="text"
                        id="email"
                        name="email"
                        placeholder="Masukkan Email atau Nomor HP"
                        required
                    >
                </div>

                <br>

                <div>
                    <label for="password">Password</label>
                    <br>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Masukkan Password"
                        required
                    >
                </div>

                <br>

                <div>
                    <label for="konfirmasi-password">
                        Konfirmasi Password
                    </label>
                    <br>
                    <input
                        type="password"
                        id="konfirmasi-password"
                        name="konfirmasi_password"
                        placeholder="Masukkan Password"
                        required
                    >
                </div>

                <br>

                <button type="submit">Daftar</button>
            </form>

            <footer>
                <p>© Copyright TripNesia 2026</p>
            </footer>
        </section>
    </main>

</body>
</html>
